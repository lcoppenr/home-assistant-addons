# The Supervisor only accepts a tag here (no @sha256 digest), and builds with
# --pull, so each rebuild picks up the current bookworm base.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm

labels:
  org.opencontainers.image.title: "Home Assistant Add-on: Alloy Journal to Loki"
  org.opencontainers.image.description: "Ships the HAOS systemd journal to Loki with Grafana Alloy"
  org.opencontainers.image.source: "https://github.com/lcoppenr/home-assistant-addons"
  org.opencontainers.image.licenses: "MIT"
